<header class="navbar" [class.navbar--scrolled]="scrolled()">
  <div class="navbar__inner">
    <!-- Logo -->
    <a routerLink="/" class="navbar__logo" (click)="closeMenu()">
      <span class="navbar__logo-text">CARATS</span>
      <span class="navbar__logo-sub">Fine Jewellery</span>
    </a>

    <!-- Desktop Nav -->
    <nav class="navbar__nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="navbar__link">Home</a>
      <div class="navbar__dropdown-wrap">
        <span class="navbar__link">Collections</span>
        <div class="navbar__dropdown">
          @for (cat of categories; track cat.slug) {
            <a [routerLink]="['/category', cat.slug]"
               class="navbar__dropdown-item"
               (click)="closeMenu()">
              {{ cat.name }}
            </a>
          }
        </div>
      </div>
      <a routerLink="/customization" routerLinkActive="active" class="navbar__link">Customize</a>
      <a routerLink="/contact" routerLinkActive="active" class="navbar__link">Contact</a>
    </nav>

    <!-- Theme Toggle -->
    <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      <span class="theme-toggle__icon theme-toggle__icon--sun" [class.active]="!isDark()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </span>
      <span class="theme-toggle__icon theme-toggle__icon--moon" [class.active]="isDark()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </span>
    </button>

    <!-- CTA -->
    <a routerLink="/customization" class="navbar__cta btn-gold">
      <span>Book Appointment</span>
    </a>

    <!-- Hamburger -->
    <button class="navbar__hamburger" (click)="toggleMenu()" [class.open]="menuOpen()" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- Mobile Menu -->
<div class="mobile-menu" [class.mobile-menu--open]="menuOpen()">
  <nav class="mobile-menu__nav">
    <a routerLink="/" class="mobile-menu__link" (click)="closeMenu()">Home</a>
    <div class="mobile-menu__section">
      <span class="mobile-menu__label eyebrow">Collections</span>
      @for (cat of categories; track cat.slug) {
        <a [routerLink]="['/category', cat.slug]"
           class="mobile-menu__sub-link"
           (click)="closeMenu()">{{ cat.name }}</a>
      }
    </div>
    <a routerLink="/customization" class="mobile-menu__link" (click)="closeMenu()">Customize</a>
    <a routerLink="/contact" class="mobile-menu__link" (click)="closeMenu()">Contact</a>

    <!-- Mobile Theme Toggle -->
    <button class="theme-toggle theme-toggle--mobile" (click)="toggleTheme()">
      <span class="theme-toggle__icon theme-toggle__icon--sun" [class.active]="!isDark()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </span>
      <span class="theme-toggle__label">{{ isDark() ? 'Light Mode' : 'Dark Mode' }}</span>
      <span class="theme-toggle__icon theme-toggle__icon--moon" [class.active]="isDark()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </span>
    </button>

    <a routerLink="/customization" class="btn-gold" style="margin-top:32px" (click)="closeMenu()">
      <span>Book Appointment</span>
    </a>
  </nav>
</div>
