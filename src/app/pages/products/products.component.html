<!-- Page Hero -->
<section class="page-hero parallax-container">
  <div class="page-hero__bg parallax-bg"
       style="background-image: url('https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=1600&q=80')">
  </div>
  <div class="page-hero__overlay"></div>
  <div class="page-hero__content">
    <span class="section-eyebrow fade-in-up">All Collections</span>
    <h1 class="fade-in-up delay-2">Our Creations</h1>
  </div>
</section>

<!-- Filter Bar -->
<div class="filter-bar">
  @for (cat of filterOptions; track cat.value) {
    <button
      class="filter-btn"
      [class.active]="activeFilter() === cat.value"
      (click)="setFilter(cat.value)">
      {{ cat.label }}
    </button>
  }
</div>

<!-- Products Grid -->
<section class="products-section">
  <div class="products-section__grid">
    @for (product of filteredProducts(); track product._id; let i = $index) {
      <app-product-card
        [product]="product"
        appScrollReveal [revealDelay]="(i % 4) * 100">
      </app-product-card>
    }
  </div>

  @if (filteredProducts().length === 0) {
    <div class="products-section__empty">
      <p>No pieces found in this collection.</p>
    </div>
  }
</section>
